name: Deploy Development (OIDC) - Overwrite Tag

on:
  push:
    branches:
      - development

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: dnptestaccount/laravel-db-based-app
  ECS_SERVICE: laravel-app1-service
  ECS_CLUSTER: Laravel-Cluster
  ECS_TASK_DEFINITION_FAMILY: laravel-app1-task
  CONTAINER_NAME: laravel-app

jobs:
  deploy:
    name: Deploy Dev
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --- CHANGE 1: SIRF DEVELOPMENT TAG PUSH KARENGE ---
      - name: Build and Push Docker Image
        id: build-image
        run: |
          # Sirf :development tag build karo
          docker build -t $ECR_REPOSITORY:development .
          
          # Push kar do (Ye purani image ko overwrite kar dega)
          docker push $ECR_REPOSITORY:development
          
          # Output me fix 'development' tag hi bhejenge
          echo "image=$ECR_REPOSITORY:development" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Task Definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEFINITION_FAMILY }} --query taskDefinition > task-definition.json

      - name: Fill New Image ID
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          # Yahan ab hamesha ':development' hi jayega
          image: ${{ steps.build-image.outputs.image }}

      # --- CHANGE 2: FORCE NEW DEPLOYMENT ---
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          # Ye important hai: ECS ko force karega ki wo naya deployment start kare
          # bhale hi image ka naam same (development) kyu na ho.
          force-new-deployment: true
