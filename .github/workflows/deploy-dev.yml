name: Deploy Development (OIDC)

on:
  push:
    branches:
      - development # Development branch push par trigger hoga

permissions:
  id-token: write   # OIDC ke liye ye permission ZAROORI hai
  contents: read    # Code checkout ke liye

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: dnptestaccount/laravel-db-based-app
  ECS_SERVICE: laravel-app1-service               
  ECS_CLUSTER: Laravel-Cluster                    
  ECS_TASK_DEFINITION_FAMILY: laravel-app1-task   
  CONTAINER_NAME: laravel-app                     

jobs:
  deploy:
    name: Deploy Dev
    runs-on: ubuntu-latest
    environment: development  # Yaha humne wo Environment link kiya jo UI me banaya

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REPOSITORY:development .
          docker tag $ECR_REPOSITORY:development $ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REPOSITORY:development
          docker push $ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # --- OIDC AUTHENTICATION STEP (No Keys!) ---
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }} # Ye Environment secret se aayega
          aws-region: ${{ env.AWS_REGION }}

      # --- Deployment Steps ---
      - name: Download Task Definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEFINITION_FAMILY }} --query taskDefinition > task-definition.json

      - name: Fill New Image ID
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
