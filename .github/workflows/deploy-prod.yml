name: Deploy Production (OIDC) - Overwrite Tag

on:
  push:
    branches:
      - main  # Production code Main branch me hai

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: dnptestaccount/laravel-db-based-app
  ECS_SERVICE: laravel-app3-service          # App 3 Service
  ECS_CLUSTER: Laravel-Cluster
  ECS_TASK_DEFINITION_FAMILY: laravel-app3-task  # App 3 Task
  CONTAINER_NAME: laravel-app

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    environment: production # GitHub Environment Name

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        id: build-image
        run: |
          # Build Production Image
          docker build -t $ECR_REPOSITORY:production .
          
          # Push Production Image (Overwrite)
          docker push $ECR_REPOSITORY:production
          
          # Output Production Image
          echo "image=$ECR_REPOSITORY:production" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }} # Production Environment Secret se aayega
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Task Definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEFINITION_FAMILY }} --query taskDefinition > task-definition.json

      - name: Fill New Image ID
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          force-new-deployment: true
